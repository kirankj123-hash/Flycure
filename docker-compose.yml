version: '3.8'

services:
  flycure-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_BASE_URL=http://localhost:3000
    depends_on:
      - redis
    networks:
      - flycure-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flycure-network
    command: redis-server --appendonly yes

  # Optional: Add database service
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: flycure
  #     POSTGRES_USER: flycure
  #     POSTGRES_PASSWORD: your_password_here
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - flycure-network

volumes:
  redis_data:
  # postgres_data:

networks:
  flycure-network:
    driver: bridge